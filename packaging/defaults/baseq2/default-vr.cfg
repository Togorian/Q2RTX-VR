// Immutable VR defaults, loaded before the player-owned q2config.cfg.
// Stock default.cfg/q2rtx.cfg load first; existing player preferences win.
seta s_enable "1"
seta ray_tracing_api "auto"
seta tm_enable "1"
seta cl_particles "1"
seta pt_enable_particles "1"
seta m_yaw "0.022"
seta tm_exposure_bias "-1.3219280948873622"
seta s_driver "wave"
seta skill "1"
seta b2_bloom_margin "1"
seta flt_enable "1"
seta flt_taa "2"
seta flt_temporal_hf "1"
seta flt_temporal_lf "1"
seta flt_temporal_spec "1"
seta flt_taa_anti_sparkle "0.25"
seta flt_taa_history_weight "0.95"
seta flt_antilag_hf "1"
seta flt_antilag_lf "0.2"
seta flt_antilag_spec "2"
seta flt_min_alpha_color_hf "0.02"
seta flt_min_alpha_color_lf "0.01"
seta flt_min_alpha_color_spec "0.01"
seta flt_atrous_deflicker_lf "-2"
seta bloom_enable "1"
seta bloom_debug "0"
seta b2_bloom_scale "1"
seta tm_debug "0"
seta cl_async "1"
seta pt_num_bounce_rays "1"
seta flt_min_alpha_moments_hf "0.01"
seta flt_atrous_hf "4"
seta flt_atrous_lf "4"
seta flt_atrous_spec "3"
seta flt_show_gradients "0"
seta b2_input_mode "1"
// Keyboard defaults load before saved preferences at each startup.
bind F1 "help"
bind F2 "pushmenu savegame"
bind F3 "pushmenu loadgame"
bind F4 "pushmenu options"
bind F5 "pushmenu video"
bind F6 "save quick"
bind F7 "pushmenu sound"
bind F8 "pushmenu players"
bind F9 "load quick"
bind F10 "pushmenu quit"
bind F11 "pushmenu photomode"
bind F12 "screenshot"
bind - "sizedown"
bind = "sizeup"
bind HOME "+b2_recenter"
bind END "b2_controller_handoff"
// Comfort defaults load before saved player preferences.
seta b2_controller_turn_mode "1"
seta b2_controller_smooth_speed "360"
seta b2_controller_snap_angle "45"
seta b2_comfort_vignette "1"
