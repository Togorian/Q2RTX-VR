// Optional key-only reset. Run explicitly; never autoexec this file.
bind F1 "help"
bind F2 "pushmenu savegame"
bind F3 "pushmenu loadgame"
bind F4 "pushmenu options"
bind F5 "pushmenu video"
bind F6 "save quick"
bind F7 "pushmenu sound"
bind F8 "pushmenu players"
bind F9 "load quick"
bind F10 "pushmenu quit"
bind F11 "pushmenu photomode"
bind F12 "screenshot"
bind - "sizedown"
bind = "sizeup"
bind HOME "+b2_recenter"
bind END "b2_controller_handoff"
